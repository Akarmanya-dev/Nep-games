<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nep Games</title>
  <meta name="description" content="Small browser games about the moments every Nepali remembers.">
  <meta name="theme-color" content="#1b1410">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1b1410;
      --surface: #2a1f18;
      --border: #3d2e24;
      --text: #f5ebe0;
      --muted: #b8a595;
      --accent: #e8483b;   /* sindoor red */
      --accent-2: #f2b33d; /* marigold */
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "Mukta", system-ui, sans-serif;
      line-height: 1.5;
      padding: 0 16px;
    }
    main { max-width: 560px; margin: 0 auto; padding: 56px 0 40px; }
    h1 { font-size: clamp(2.4rem, 11vw, 3.4rem); font-weight: 800; line-height: 1.05; }
    h1 span { color: var(--accent-2); }
    .tagline { color: var(--muted); margin-top: 12px; font-size: 1.1rem; }
    .games { list-style: none; padding: 0; margin-top: 40px; display: grid; gap: 12px; }
    .game a {
      display: flex; align-items: center; gap: 16px;
      padding: 16px; border-radius: 14px;
      background: var(--surface); border: 1px solid var(--border);
      color: inherit; text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    .game a:hover, .game a:focus-visible { border-color: var(--accent-2); transform: translateY(-1px); }
    .game .icon { font-size: 2rem; width: 48px; text-align: center; flex-shrink: 0; }
    .game .name { font-weight: 600; font-size: 1.15rem; }
    .game .desc { color: var(--muted); font-size: .95rem; }
    .empty {
      margin-top: 40px; padding: 28px 20px; border-radius: 14px;
      border: 1px dashed var(--border); color: var(--muted); text-align: center;
    }
    .empty strong { display: block; color: var(--text); font-size: 1.15rem; margin-bottom: 4px; }
    footer { color: var(--muted); font-size: .85rem; margin-top: 48px; text-align: center; }
    .flag { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>नेपाली <span>खेल</span></h1>
    <p class="tagline">Small games about the moments every Nepali remembers.</p>

    <ul class="games" id="games"></ul>

    <footer>Made with <span class="flag">♥</span> for everyone who remembers.</footer>
  </main>

  <script>
    // Add each finished game here; its folder lives at games/<slug>/index.html.
    const GAMES = [
      // { slug: "example", icon: "🎮", name: "Name", desc: "One-line hook." },
    ];

    const list = document.getElementById("games");
    if (GAMES.length === 0) {
      list.outerHTML = '<div class="empty"><strong>पहिलो खेल छिट्टै आउँदैछ</strong>The first game is coming soon.</div>';
    } else {
      for (const g of GAMES) {
        const li = document.createElement("li");
        li.className = "game";
        li.innerHTML = `<a href="games/${g.slug}/"><span class="icon">${g.icon}</span>
          <span><span class="name"></span><br><span class="desc"></span></span></a>`;
        li.querySelector(".name").textContent = g.name;
        li.querySelector(".desc").textContent = g.desc;
        list.appendChild(li);
      }
    }
  </script>
</body>
</html>
